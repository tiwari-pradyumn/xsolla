[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Put the repo root on sys.path so `import app` resolves. Without this only
# `python -m pytest` works, because that form alone prepends the working
# directory -- bare `pytest`, which is what CI runs, fails to collect.
pythonpath = .
# Coverage is on by default so a local `pytest` gates exactly as CI does.
# Escape hatch while iterating on one test: `pytest --no-cov`.
addopts = --cov
