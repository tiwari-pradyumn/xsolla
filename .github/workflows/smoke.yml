name: Smoke (deployed)

# Railway deploys main from its own GitHub integration, so this is the
# after-the-fact check that the thing now serving traffic is the thing CI
# passed. Run it manually after a deploy, or on a schedule to catch a host
# that has quietly stopped.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the running service
        required: true
        default: https://xsolla-production.up.railway.app
  schedule:
    # 07:00 UTC daily. Cheap liveness check on an in-memory single instance.
    - cron: "0 7 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the smoke suite against the deployment
        env:
          BASE_URL: ${{ inputs.base_url || 'https://xsolla-production.up.railway.app' }}
          # Repository secret. Never hardcode the bearer token: this repo is public.
          AUTH_TOKEN: ${{ secrets.SMOKE_AUTH_TOKEN }}
        run: |
          if [ -z "$AUTH_TOKEN" ]; then
            echo "::error::SMOKE_AUTH_TOKEN is not set on this repository"
            exit 1
          fi
          python scripts/smoke.py "$BASE_URL" "$AUTH_TOKEN"
